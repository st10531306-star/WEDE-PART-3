<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book an Appointment - BraamBaddies Hair Studio</title>
    
    <meta name="description"
           content="Explore our Explore affordable braids, knotless braids, box braids, hair installation and hair care at BraamBaddies Hair Studio in Braamfontein.">
    <meta name="keywords"
           content="BraamBaddies Hair Studio, Braamfontein, braids, knotless braids, box braids, hair installation, hair care, Braamfontein salon">
    <meta name="author"  
    content="BraamBaddies Hair Studio">  
<head>
    <title>Book an Appointment - BraamBaddies Hair Studio</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>BraamBaddies Hair Studio</h1>
        <p>Book Your Appointment</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="contact.html">Contact</a>
    </nav>

    <main>
        <h2>Book an Appointment</h2>

        <p>Fill in the form below and we will get back to you.</p>

        <form onsubmit="showMessage(); return false;">

            <label for="name">Full Name:</label><br>
            <input type="text" id="name" name="name" required>
            <br><br>

            <label for="email">Email Address:</label><br>
            <input type="email" id="email" name="email" required>
            <br><br>

            <label for="phone">Phone Number:</label><br>
            <input type="tel" id="phone" name="phone" required>
            <br><br>

            <label for="service">Choose a Service:</label><br>
            <select id="service" name="service" required>
                <option value="">-- Select a service --</option>
                <option value="knotless">Knotless Braids</option>
                <option value="box-braids">Box Braids</option>
                <option value="cornrows">Cornrows</option>
                <option value="wig-installation">Wig Installation</option>
            </select>
            <br><br>

            <label for="date">Preferred Date:</label><br>
            <input type="date" id="date" name="date" required>
            <br><br>

            <label for="message">Additional Message:</label><br>
            <textarea id="message" name="message" rows="5"></textarea>
            <br><br>

            <button type="submit">Submit Booking</button>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 BraamBaddies Hair Studio</p>
    </footer>

   <script>
document.addEventListener("DOMContentLoaded", function () {
    const form = document.querySelector("form");

    if (!form) return;

    form.addEventListener("submit", function (event) {
        if (!form.checkValidity()) {
            event.preventDefault();
            form.reportValidity();
            return;
        }

        const email = form.querySelector('input[type="email"]');

        if (email && !email.validity.valid) {
            event.preventDefault();
            alert("Please enter a valid email address.");
            email.focus();
        }
    });
});
</script>


</body>
</html>
